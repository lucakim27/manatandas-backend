spring.application.name=manatandas-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/manatandas
spring.datasource.username=heesukim
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Your Google OAuth Client ID (from Google Cloud Console > APIs & Services >
# Credentials > OAuth 2.0 Client IDs > Web application). This is public, not
# a secret -- it's meant to be embedded in frontend code too.
google.oauth.client-id=${GOOGLE_CLIENT_ID:613954349182-krvho5j72bgaan04sdgfkbi138bhdlpu.apps.googleusercontent.com}

# Secret used to SIGN your own session JWTs -- this one IS sensitive, unlike
# the client id above. Set a real value via the JWT_SECRET environment
# variable rather than editing this file, so it never ends up committed to
# git. The fallback below is only for convenience during local dev.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-use-32chars+}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# The JWT now lives in an httpOnly cookie instead of the response body, so
# client-side JS (and any XSS payload) can never read it. "secure" must be
# true in production (cookie only sent over HTTPS) -- it's false here only
# because local dev runs on plain http. Chrome/Firefox treat "localhost"
# itself as a secure context even over http, so this rarely needs changing
# even in dev.
app.cookie.name=auth_token
app.cookie.secure=${COOKIE_SECURE:false}
